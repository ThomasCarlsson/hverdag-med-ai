name: Post til Instagram

on:
  schedule:
    - cron: "7 * * * *"   # hver time, 7 minutter over
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post opslag, hvis tiden er kommet
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/post.py

      - name: Opdater prompt-siden
        if: always()
        run: python3 scripts/build_prompts.py

      - name: Gem status
        if: always()
        run: |
          if [ -n "$(git status --porcelain queue prompts config.json)" ]; then
            git config user.name "hverdag-bot"
            git config user.email "hverdag-bot@users.noreply.github.com"
            git add queue prompts config.json
            git commit -m "Opdater status på opslag og prompt-side"
            git pull --rebase
            git push
          fi
